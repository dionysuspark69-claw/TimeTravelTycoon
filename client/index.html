<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <title>ChronoTransit - Time Travel Idle Game</title>
    <meta name="description" content="Run a time travel business in this idle incremental game. Transport customers through history, upgrade your time machine, and build a chrono-empire across the ages." />
    <meta name="keywords" content="idle game, incremental game, time travel, clicker game, browser game, free to play" />
    <meta property="og:title" content="ChronoTransit - Time Travel Idle Game" />
    <meta property="og:description" content="Transport customers through history in this free idle incremental game. Upgrade your time machine, unlock new eras, and build a chrono-empire." />
    <meta property="og:type" content="website" />
    <link rel="canonical" href="https://time-travel-tycoon.vercel.app/" />
    <meta property="og:url" content="https://time-travel-tycoon.vercel.app/" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "ChronoTransit",
      "description": "A free browser-based idle incremental game where you run a time travel business. Transport customers through historical eras, upgrade your time machines, and build a chrono-empire.",
      "genre": ["Idle Game", "Incremental Game", "Strategy"],
      "gamePlatform": "Web Browser",
      "applicationCategory": "Game",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "url": "https://time-travel-tycoon.vercel.app"
    }
    </script>
    <!-- AdSense loaded after page content is ready, not on initial shell -->
  </head>
  <body>
    <div id="root"></div>

    <!-- Visible content for crawlers / no-script users -->
    <noscript>
      <div style="font-family:sans-serif;max-width:600px;margin:40px auto;padding:20px;">
        <h1>ChronoTransit - Time Travel Idle Game</h1>
        <p>ChronoTransit is a free browser-based idle incremental game where you run a time travel business. Transport customers to historical eras, upgrade your time machines, hire managers, and build a chrono-empire across history.</p>
        <h2>Features</h2>
        <ul>
          <li>50+ unlockable time travel destinations from the Dinosaur Era to the Galactic Empire</li>
          <li>Upgrade your time machine fleet for speed, capacity, and revenue</li>
          <li>Hire managers with unique perks and bonuses</li>
          <li>Discover rare artifacts and complete collections</li>
          <li>Prestige system for long-term progression</li>
          <li>Global leaderboards</li>
          <li>Missions and achievements</li>
        </ul>
        <p>Please enable JavaScript to play ChronoTransit.</p>
      </div>
    </noscript>

    <script>
      // Boot guard: if OUR bundle (/assets/*) fails to load — e.g. the browser
      // cached an index.html that points at a hash that no longer exists post-
      // deploy — force a one-time hard reload that bypasses the cache. Limited
      // to /assets/* so third-party scripts (ads, etc.) erroring out can't
      // trigger a reload loop. Flag persists for the tab's lifetime — clearing
      // it on `load` was a bug because a late third-party error could then
      // re-trigger the guard.
      (function () {
        var FLAG = "__cb_reload";
        window.addEventListener("error", function (e) {
          var t = e && e.target;
          if (!t || !(t instanceof HTMLScriptElement)) return;
          if (!t.src || t.src.indexOf("/assets/") === -1) return;
          try {
            if (sessionStorage.getItem(FLAG)) return;
            sessionStorage.setItem(FLAG, "1");
          } catch (_) {}
          var u = new URL(window.location.href);
          u.searchParams.set("cb", Date.now().toString(36));
          window.location.replace(u.toString());
        }, true);
      })();
    </script>
    <script>
      // Blank-screen failsafe: a blank page is undebuggable for players. If the
      // app hasn't rendered anything into #root within 8s, show what went wrong
      // and offer recovery actions. Never touches the game save.
      (function () {
        var firstError = null;
        window.addEventListener("error", function (e) {
          if (!firstError) firstError = (e.error && e.error.stack) || e.message || "Unknown script error";
        });
        window.addEventListener("unhandledrejection", function (e) {
          if (!firstError) firstError = (e.reason && (e.reason.stack || e.reason.message)) || "Unhandled promise rejection";
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount > 0) return; // app rendered, all good
          var detail = firstError ? String(firstError).slice(0, 800) : "No script error was caught — the app bundle may not have loaded (network or cache issue).";
          root.innerHTML =
            '<div style="font-family:sans-serif;max-width:560px;margin:48px auto;padding:24px;background:#111827;color:#e5e7eb;border-radius:12px;">' +
            '<h2 style="color:#22d3ee;margin-top:0;">ChronoTransit could not start</h2>' +
            '<p>Your save data is safe. Something prevented the game from loading:</p>' +
            '<pre style="white-space:pre-wrap;word-break:break-word;background:#1f2937;padding:12px;border-radius:8px;font-size:12px;max-height:200px;overflow:auto;">' +
            detail.replace(/&/g, "&amp;").replace(/</g, "&lt;") +
            "</pre>" +
            '<button onclick="location.reload()" style="margin-right:8px;padding:8px 16px;background:#0891b2;color:#fff;border:0;border-radius:8px;cursor:pointer;">Reload</button>' +
            '<button onclick="var u=new URL(location.href);u.searchParams.set(\'cb\',Date.now().toString(36));location.replace(u)" style="padding:8px 16px;background:#374151;color:#fff;border:0;border-radius:8px;cursor:pointer;">Hard refresh (bypass cache)</button>' +
            '<p style="font-size:12px;color:#9ca3af;">If this keeps happening, screenshot this message — it tells us exactly what broke.</p>' +
            "</div>";
        }, 8000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
